<!DOCTYPE html>
<html>
<head>
<title>Click Game</title>
</head>
<body style="text-align:center;">
<h2>Click the button!</h2>
<p id="score">Score: 0</p>
<button onclick="add()">Click Me!</button>

<script>
let score = 0;
function add() {
  score++;
  document.getElementById('score').innerText = "Score: " + score;
}
</script>
</body>
</html>
